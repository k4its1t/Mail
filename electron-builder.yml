appId: com.mail.desktop
productName: Mail
copyright: Copyright © 2026 Mail Contributors
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
compression: normal
win:
  icon: build/icon.png
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mail
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
